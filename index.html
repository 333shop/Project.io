<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wyvern</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg1: #0f0c29;
      --bg2: #302b63;
      --bg3: #24243e;
      --accent: #a78bfa;
      --accent2: #8b5cf6;
      --text: #ffffff;
      --muted: #c4b5fd;
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.1);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Particles */
    .particle {
      position: fixed;
      width: 8px;
      height: 8px;
      background: rgba(167, 139, 250, 0.35);
      border-radius: 50%;
      pointer-events: none;
      animation: rise 14s linear infinite;
      z-index: 0;
    }
    @keyframes rise {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: rgba(15,12,41,0.75);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
    }
    .logo span { color: var(--accent); }

    .nav {
      display: flex;
      gap: 6px;
    }
    .nav button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .nav button:hover,
    .nav button.active {
      color: white;
      background: rgba(167,139,250,0.15);
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-chip {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 5px 14px 5px 5px;
    }
    .user-chip.show { display: flex; }

    .user-chip img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .user-meta .name { font-size: 0.9rem; font-weight: 600; }

    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 4px;
      width: fit-content;
      margin-top: 2px;
    }
    .badge-owner { background: #f59e0b; color: #1a1200; }
    .badge-dev { background: #3b82f6; color: white; }
    .badge-member { background: rgba(255,255,255,0.1); color: #c4b5fd; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(139,92,246,0.4);
    }

    .btn-danger {
      background: transparent;
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.3);
      padding: 8px 14px;
    }
    .btn-danger:hover {
      background: rgba(248,113,113,0.1);
      box-shadow: none;
      transform: none;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:hover {
      color: white;
      background: rgba(255,255,255,0.05);
      box-shadow: none;
    }

    /* Pages */
    .page {
      display: none;
      padding: 40px 24px;
      max-width: 1100px;
      margin: 0 auto;
      animation: fadeIn 0.4s ease;
      position: relative;
      z-index: 1;
    }
    .page.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* HOME */
    .home-hero {
      text-align: center;
      padding: 50px 0 30px;
    }
    .greeting {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 10px;
      min-height: 28px;
    }
    .home-hero h1 {
      font-size: clamp(3.2rem, 10vw, 5.8rem);
      font-weight: 800;
      background: linear-gradient(90deg, #fff, #c4b5fd, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
      line-height: 1.1;
    }
    .discord-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 1.05rem;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 50px;
      border: 1px solid rgba(167,139,250,0.3);
      transition: 0.25s;
    }
    .discord-link:hover {
      background: rgba(167,139,250,0.12);
      transform: translateY(-2px);
    }

    .video-section {
      margin-top: 60px;
    }
    .video-section h3 {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 18px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 18px;
    }
    .video-card {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      aspect-ratio: 16/9;
    }
    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* TICKETS */
    .tickets-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .tickets-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tickets-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
      height: calc(100vh - 190px);
      min-height: 480px;
    }

    .ticket-list, .ticket-chat {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .ticket-list-header {
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .ticket-items {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .ticket-item {
      padding: 13px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.15s;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .ticket-item:hover { background: rgba(255,255,255,0.05); }
    .ticket-item.active {
      background: rgba(167,139,250,0.12);
      border-color: rgba(167,139,250,0.25);
    }
    .ticket-item .title {
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ticket-item .meta {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .status {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .status-open { background: rgba(34,197,94,0.15); color: #4ade80; }
    .status-closed { background: rgba(248,113,113,0.15); color: #f87171; }

    .chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-header h3 { font-size: 1.05rem; }
    .chat-header span { font-size: 0.78rem; color: var(--muted); }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .msg.me {
      align-self: flex-end;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      border-bottom-right-radius: 4px;
    }
    .msg.other {
      align-self: flex-start;
      background: rgba(255,255,255,0.07);
      border-bottom-left-radius: 4px;
    }
    .msg .author {
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 3px;
      opacity: 0.85;
    }

    .chat-input {
      padding: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }
    .chat-input input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      font-size: 0.92rem;
      outline: none;
    }
    .chat-input input:focus { border-color: var(--accent); }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 12px;
      text-align: center;
      padding: 40px;
    }

    /* Login Modal */
    .login-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .login-modal.active { display: flex; }

    .login-card {
      background: #1a1635;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }
    .login-card h2 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    .login-card p {
      color: var(--muted);
      margin-bottom: 28px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(6px);
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: #1a1635;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
    }
    .modal h3 { margin-bottom: 16px; font-size: 1.2rem; }
    .modal input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: white;
      font-size: 0.95rem;
      margin-bottom: 16px;
      outline: none;
    }
    .modal input:focus { border-color: var(--accent); }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    @media (max-width: 800px) {
      .tickets-layout { grid-template-columns: 1fr; height: auto; }
      .ticket-list { max-height: 260px; }
      header { padding: 12px 16px; }
      .nav { display: none; }
    }
  </style>
</head>
<body>

  <!-- Particles -->
  <div class="particle" style="left:10%;animation-delay:0s;"></div>
  <div class="particle" style="left:25%;animation-delay:2s;width:6px;height:6px;"></div>
  <div class="particle" style="left:40%;animation-delay:4s;"></div>
  <div class="particle" style="left:60%;animation-delay:1s;width:10px;height:10px;"></div>
  <div class="particle" style="left:75%;animation-delay:3s;"></div>
  <div class="particle" style="left:90%;animation-delay:5s;width:7px;height:7px;"></div>

  <!-- HEADER (always visible) -->
  <header>
    <div class="left">
      <a href="#" class="logo" onclick="showPage('home')">WYVERN<span>.</span></a>
      <nav class="nav">
        <button id="navHome" class="active" onclick="showPage('home')">
          <i class="fas fa-home"></i> Home
        </button>
        <button id="navTickets" onclick="showPage('tickets')">
          <i class="fas fa-ticket-alt"></i> Tickets
        </button>
      </nav>
    </div>

    <div class="user-area">
      <!-- Shown when logged in -->
      <div class="user-chip" id="userChip">
        <img id="userAvatar" src="" alt="">
        <div class="user-meta">
          <span class="name" id="userName">User</span>
          <span class="badge" id="userBadge">Member</span>
        </div>
      </div>

      <!-- Login button (shown when NOT logged in) -->
      <button class="btn" id="loginBtn" onclick="openLoginModal()">
        <i class="fab fa-discord"></i> Login
      </button>

      <!-- Logout button (shown when logged in) -->
      <button class="btn btn-danger" id="logoutBtn" style="display:none;" onclick="logout()">
        Logout
      </button>
    </div>
  </header>

  <!-- HOME -->
  <div class="page active" id="page-home">
    <div class="home-hero">
      <div class="greeting" id="greeting"></div>
      <h1>WYVERN</h1>
      <a href="https://discord.gg/wyvernscripts" target="_blank" class="discord-link">
        <i class="fab fa-discord"></i> discord.gg/wyvernscripts
      </a>

      <div class="video-section">
        <h3>Preview</h3>
        <div class="video-grid">
          <div class="video-card">
            <video autoplay muted loop playsinline>
              <source src="video1.mp4" type="video/mp4">
            </video>
          </div>
          <div class="video-card">
            <video autoplay muted loop playsinline>
              <source src="video2.mp4" type="video/mp4">
            </video>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TICKETS -->
  <div class="page" id="page-tickets">
    <div class="tickets-header">
      <h2><i class="fas fa-ticket-alt"></i> Tickets</h2>
      <button class="btn" onclick="handleNewTicket()">
        <i class="fas fa-plus"></i> New Ticket
      </button>
    </div>

    <div class="tickets-layout">
      <div class="ticket-list">
        <div class="ticket-list-header" id="listHeader">Tickets</div>
        <div class="ticket-items" id="ticketList"></div>
      </div>

      <div class="ticket-chat">
        <div class="empty-state" id="chatEmpty">
          <i class="fas fa-comments" style="font-size:2.5rem;opacity:0.4;"></i>
          <div>Select a ticket or create a new one</div>
        </div>

        <div id="chatActive" style="display:none;flex-direction:column;height:100%;">
          <div class="chat-header">
            <div>
              <h3 id="chatTitle">Ticket</h3>
              <span id="chatMeta"></span>
            </div>
            <div id="staffActions"></div>
          </div>
          <div class="messages" id="messages"></div>
          <div class="chat-input">
            <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button class="btn" onclick="sendMessage()">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- LOGIN MODAL -->
  <div class="login-modal" id="loginModal">
    <div class="login-card">
      <h2>Login to Wyvern</h2>
      <p>You need to login with Discord to create tickets</p>
      <button class="btn" style="width:100%;justify-content:center;padding:14px;" onclick="startDiscordLogin()">
        <i class="fab fa-discord"></i> Continue with Discord
      </button>
      <br><br>
      <button class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="closeLoginModal()">Cancel</button>
    </div>
  </div>

  <!-- CREATE / RENAME MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modalTitle">New Ticket</h3>
      <input type="text" id="modalInput" placeholder="What do you need help with?">
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn" id="modalConfirm" onclick="confirmModal()">Create</button>
      </div>
    </div>
  </div>

  <script>
    const DISCORD_AUTH_URL = "https://discord.com/oauth2/authorize?client_id=1535502240352313425&response_type=code&redirect_uri=https%3A%2F%2Fwyvern-auth.julianisok2.workers.dev%2Fcallback&scope=identify+guilds+rpc";

    let config = { owners: [], devs: [] };
    let currentUser = null;
    let tickets = [];
    let activeTicketId = null;
    let modalMode = "create";

    async function init() {
      await loadConfig();
      loadTickets();

      // Coming back from Discord
      const params = new URLSearchParams(window.location.search);
      if (params.has("id") && params.has("username")) {
        const user = {
          id: params.get("id"),
          username: params.get("username"),
          avatar: params.get("avatar")
        };
        localStorage.setItem("wyvern_user", JSON.stringify(user));
        window.history.replaceState({}, document.title, window.location.pathname);
        currentUser = user;
        updateAuthUI();
        showPage("home");
        return;
      }

      // Restore session
      const saved = localStorage.getItem("wyvern_user");
      if (saved) {
        currentUser = JSON.parse(saved);
      }
      updateAuthUI();
      renderTicketList();
    }

    async function loadConfig() {
      try {
        const res = await fetch("config.txt");
        if (!res.ok) return;
        const text = await res.text();
        text.split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
          const parts = line.split(/\s+/);
          if (parts.length < 2) return;
          const role = parts[0].toLowerCase();
          const id = parts[1];
          if (role === "owner") config.owners.push({ id });
          if (role === "dev") config.devs.push({ id });
        });
      } catch(e) {}
    }

    function loadTickets() {
      tickets = JSON.parse(localStorage.getItem("wyvern_tickets") || "[]");
    }
    function saveTickets() {
      localStorage.setItem("wyvern_tickets", JSON.stringify(tickets));
    }

    function startDiscordLogin() {
      window.location.href = DISCORD_AUTH_URL;
    }

    function openLoginModal() {
      document.getElementById("loginModal").classList.add("active");
    }
    function closeLoginModal() {
      document.getElementById("loginModal").classList.remove("active");
    }

    function logout() {
      localStorage.removeItem("wyvern_user");
      currentUser = null;
      updateAuthUI();
      showPage("home");
      renderTicketList();
    }

    function updateAuthUI() {
      const loginBtn = document.getElementById("loginBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const userChip = document.getElementById("userChip");
      const greeting = document.getElementById("greeting");

      if (currentUser) {
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-flex";
        userChip.classList.add("show");

        document.getElementById("userAvatar").src = currentUser.avatar;
        document.getElementById("userName").textContent = currentUser.username;

        const badge = getBadge(currentUser.id);
        const badgeEl = document.getElementById("userBadge");
        badgeEl.textContent = badge.text;
        badgeEl.className = "badge " + badge.class;

        greeting.textContent = `Welcome back, ${currentUser.username}`;
      } else {
        loginBtn.style.display = "inline-flex";
        logoutBtn.style.display = "none";
        userChip.classList.remove("show");
        greeting.textContent = "";
      }
    }

    // Everyone is Member unless listed in config.txt
    function getBadge(id) {
      if (config.owners.some(o => o.id === id)) return { text: "Owner", class: "badge-owner" };
      if (config.devs.some(d => d.id === id)) return { text: "Dev", class: "badge-dev" };
      return { text: "Member", class: "badge-member" };
    }

    function isStaff() {
      if (!currentUser) return false;
      const b = getBadge(currentUser.id).text;
      return b === "Owner" || b === "Dev";
    }

    function showPage(name) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById("page-" + name).classList.add("active");
      document.getElementById("navHome").classList.toggle("active", name === "home");
      document.getElementById("navTickets").classList.toggle("active", name === "tickets");
      if (name === "tickets") renderTicketList();
    }

    // ===== TICKETS =====
    function handleNewTicket() {
      if (!currentUser) {
        openLoginModal();
        return;
      }
      openCreateModal();
    }

    function renderTicketList() {
      const list = document.getElementById("ticketList");
      const header = document.getElementById("listHeader");

      let visible = [];
      if (currentUser && isStaff()) {
        visible = tickets;
        header.textContent = "All Tickets";
      } else if (currentUser) {
        visible = tickets.filter(t => t.authorId === currentUser.id);
        header.textContent = "Your Tickets";
      } else {
        visible = []; // guests see nothing or we can show public tickets later
        header.textContent = "Tickets";
      }

      if (visible.length === 0) {
        list.innerHTML = `<div style="padding:30px;text-align:center;color:var(--muted);font-size:0.9rem;">
          ${currentUser ? "No tickets yet" : "Login to view your tickets"}
        </div>`;
        return;
      }

      list.innerHTML = visible
        .sort((a,b) => b.updated - a.updated)
        .map(t => `
          <div class="ticket-item ${t.id === activeTicketId ? "active" : ""}" onclick="openTicket('${t.id}')">
            <div class="title">${escapeHtml(t.title)}</div>
            <div class="meta">
              <span>${t.authorName}</span>
              <span class="status status-${t.status}">${t.status}</span>
            </div>
          </div>
        `).join("");
    }

    function openTicket(id) {
      if (!currentUser) {
        openLoginModal();
        return;
      }

      activeTicketId = id;
      const ticket = tickets.find(t => t.id === id);
      if (!ticket) return;

      // Members can only open their own tickets
      if (!isStaff() && ticket.authorId !== currentUser.id) {
        alert("You can only view your own tickets");
        return;
      }

      document.getElementById("chatEmpty").style.display = "none";
      document.getElementById("chatActive").style.display = "flex";

      document.getElementById("chatTitle").textContent = ticket.title;
      document.getElementById("chatMeta").textContent = `${ticket.authorName} · ${ticket.status}`;

      const actions = document.getElementById("staffActions");
      if (isStaff()) {
        actions.innerHTML = `
          <button class="btn btn-ghost" style="margin-right:6px;" onclick="openRenameModal()">Rename</button>
          <button class="btn btn-danger" onclick="toggleTicketStatus()">${ticket.status === "open" ? "Close" : "Reopen"}</button>
        `;
      } else {
        actions.innerHTML = "";
      }

      renderMessages(ticket);
      renderTicketList();
    }

    function renderMessages(ticket) {
      const box = document.getElementById("messages");
      box.innerHTML = ticket.messages.map(m => `
        <div class="msg ${m.authorId === currentUser.id ? "me" : "other"}">
          ${m.authorId !== currentUser.id ? `<div class="author">${escapeHtml(m.authorName)}</div>` : ""}
          ${escapeHtml(m.text)}
        </div>
      `).join("");
      box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
      if (!currentUser) {
        openLoginModal();
        return;
      }

      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text || !activeTicketId) return;

      const ticket = tickets.find(t => t.id === activeTicketId);
      if (!ticket || ticket.status === "closed") {
        alert("This ticket is closed");
        return;
      }

      ticket.messages.push({
        authorId: currentUser.id,
        authorName: currentUser.username,
        text,
        time: Date.now()
      });
      ticket.updated = Date.now();
      saveTickets();
      input.value = "";
      renderMessages(ticket);
      renderTicketList();
    }

    function openCreateModal() {
      modalMode = "create";
      document.getElementById("modalTitle").textContent = "New Ticket";
      document.getElementById("modalInput").value = "";
      document.getElementById("modalConfirm").textContent = "Create";
      document.getElementById("modal").classList.add("active");
      document.getElementById("modalInput").focus();
    }

    function openRenameModal() {
      if (!activeTicketId) return;
      const ticket = tickets.find(t => t.id === activeTicketId);
      modalMode = "rename";
      document.getElementById("modalTitle").textContent = "Rename Ticket";
      document.getElementById("modalInput").value = ticket.title;
      document.getElementById("modalConfirm").textContent = "Save";
      document.getElementById("modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
    }

    function confirmModal() {
      const title = document.getElementById("modalInput").value.trim();
      if (!title) return;

      if (modalMode === "create") {
        const id = "t_" + Date.now();
        tickets.push({
          id,
          title,
          authorId: currentUser.id,
          authorName: currentUser.username,
          status: "open",
          created: Date.now(),
          updated: Date.now(),
          messages: [{
            authorId: currentUser.id,
            authorName: currentUser.username,
            text: "Ticket created",
            time: Date.now()
          }]
        });
        saveTickets();
        closeModal();
        openTicket(id);
      } else {
        const ticket = tickets.find(t => t.id === activeTicketId);
        ticket.title = title;
        ticket.updated = Date.now();
        saveTickets();
        closeModal();
        openTicket(activeTicketId);
      }
      renderTicketList();
    }

    function toggleTicketStatus() {
      const ticket = tickets.find(t => t.id === activeTicketId);
      if (!ticket) return;
      ticket.status = ticket.status === "open" ? "closed" : "open";
      ticket.updated = Date.now();
      saveTickets();
      openTicket(activeTicketId);
      renderTicketList();
    }

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    init();
  </script>
</body>
</html>
