<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wyvern</title>
  <style>
    :root {
      --bg: #06090f;
      --card: #0c111c;
      --border: rgba(255,255,255,0.06);
      --accent: #5865F2;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --owner: #f59e0b;
      --dev: #3b82f6;
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .app {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 90% 60% at 50% -30%, rgba(88,101,242,0.15), transparent),
        var(--bg);
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      border-bottom: 1px solid var(--border);
      background: rgba(6,9,15,0.8);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: white;
      text-decoration: none;
    }
    .logo span { color: var(--accent); }

    .nav {
      display: flex;
      gap: 6px;
    }

    .nav button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .nav button:hover {
      color: white;
      background: rgba(255,255,255,0.04);
    }
    .nav button.active {
      color: white;
      background: rgba(88,101,242,0.15);
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 5px 14px 5px 5px;
    }

    .user-chip img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .user-meta .name {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 4px;
      width: fit-content;
      margin-top: 2px;
    }
    .badge-owner { background: var(--owner); color: #1a1200; }
    .badge-dev { background: var(--dev); color: white; }
    .badge-member { background: #1e293b; color: #94a3b8; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      background: #4752c4;
      transform: translateY(-1px);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(239,68,68,0.3);
      padding: 8px 16px;
    }
    .btn-danger:hover {
      background: rgba(239,68,68,0.1);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      color: white;
      background: rgba(255,255,255,0.04);
    }

    /* ===== PAGES ===== */
    .page {
      display: none;
      padding: 40px 32px;
      max-width: 1100px;
      margin: 0 auto;
      animation: fadeIn 0.4s ease;
    }
    .page.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== HOME ===== */
    .home-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 140px);
      text-align: center;
      gap: 16px;
    }

    .greeting {
      font-size: 1.1rem;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .home-hero h1 {
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 800;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #ffffff 20%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .discord-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #a5b4fc;
      font-size: 1.05rem;
      font-weight: 500;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 50px;
      border: 1px solid rgba(165,180,252,0.2);
      transition: all 0.25s;
      margin-top: 8px;
    }
    .discord-link:hover {
      background: rgba(88,101,242,0.12);
      border-color: rgba(88,101,242,0.4);
      color: #c7d2fe;
      transform: translateY(-1px);
    }

    /* Videos */
    .video-section {
      margin-top: 60px;
      width: 100%;
      max-width: 960px;
    }

    .video-section h3 {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      text-align: center;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }

    .video-card {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      aspect-ratio: 16/9;
      position: relative;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== TICKETS ===== */
    .tickets-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .tickets-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tickets-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      height: calc(100vh - 200px);
      min-height: 500px;
    }

    .ticket-list {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .ticket-list-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .ticket-items {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .ticket-item {
      padding: 13px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .ticket-item:hover {
      background: rgba(255,255,255,0.03);
    }
    .ticket-item.active {
      background: rgba(88,101,242,0.12);
      border-color: rgba(88,101,242,0.25);
    }

    .ticket-item .title {
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ticket-item .meta {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .status {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .status-open { background: rgba(34,197,94,0.15); color: #4ade80; }
    .status-closed { background: rgba(239,68,68,0.15); color: #f87171; }

    .ticket-chat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chat-header .info h3 {
      font-size: 1.05rem;
      font-weight: 600;
    }
    .chat-header .info span {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.45;
      animation: msgIn 0.25s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.me {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.other {
      align-self: flex-start;
      background: rgba(255,255,255,0.05);
      border-bottom-left-radius: 4px;
    }

    .msg .author {
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 3px;
      opacity: 0.8;
    }

    .chat-input {
      padding: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }
    .chat-input input:focus {
      border-color: var(--accent);
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 14px;
      padding: 40px;
      text-align: center;
    }

    /* ===== AUTH ===== */
    .auth-screen {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-screen.active { display: flex; }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 52px 44px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .auth-card h2 {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .auth-card p {
      color: var(--muted);
      margin-bottom: 36px;
      font-size: 0.95rem;
    }

    .discord-btn {
      width: 100%;
      background: #5865F2;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
    }
    .discord-btn:hover {
      background: #4752c4;
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(88,101,242,0.3);
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(6px);
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
    }

    .modal h3 {
      font-size: 1.25rem;
      margin-bottom: 18px;
    }

    .modal input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 15px;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 18px;
      outline: none;
    }
    .modal input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .hidden { display: none !important; }

    @media (max-width: 800px) {
      .tickets-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      .ticket-list { max-height: 280px; }
      header { padding: 14px 18px; }
      .page { padding: 24px 16px; }
      .nav { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- HEADER -->
    <header id="mainHeader" class="hidden">
      <div class="left">
        <a href="#" class="logo" onclick="showPage('home')">WYVERN<span>.</span></a>
        <nav class="nav">
          <button id="navHome" class="active" onclick="showPage('home')">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home
          </button>
          <button id="navTickets" onclick="showPage('tickets')">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Tickets
          </button>
        </nav>
      </div>

      <div class="user-area">
        <div class="user-chip">
          <img id="userAvatar" src="" alt="">
          <div class="user-meta">
            <span class="name" id="userName">User</span>
            <span class="badge" id="userBadge">Member</span>
          </div>
        </div>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
      </div>
    </header>

    <!-- HOME PAGE -->
    <div class="page" id="page-home">
      <div class="home-hero">
        <div class="greeting" id="greeting"></div>
        <h1>WYVERN</h1>

        <a href="https://discord.gg/wyvernscripts" target="_blank" class="discord-link">

          discord.gg/wyvernscripts
        </a>

        <!-- VIDEO PREVIEW -->
        <div class="video-section">
          <h3>Preview</h3>
          <div class="video-grid">
            <div class="video-card">
              <video autoplay muted loop playsinline>
                <source src="video1.mp4" type="video/mp4">
                Your browser does not support the video tag.
              </video>
            </div>
            <div class="video-card">
              <video autoplay muted loop playsinline>
                <source src="video2.mp4" type="video/mp4">
              </video>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- TICKETS PAGE -->
    <div class="page" id="page-tickets">
      <div class="tickets-header">
        <h2>
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Tickets
        </h2>
        <button class="btn btn-primary" onclick="openCreateModal()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Ticket
        </button>
      </div>

      <div class="tickets-layout">
        <div class="ticket-list">
          <div class="ticket-list-header" id="listHeader">Your Tickets</div>
          <div class="ticket-items" id="ticketList"></div>
        </div>

        <div class="ticket-chat">
          <div class="empty-state" id="chatEmpty">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <div>Select a ticket or create a new one</div>
          </div>

          <div id="chatActive" class="hidden" style="display:flex;flex-direction:column;height:100%;">
            <div class="chat-header">
              <div class="info">
                <h3 id="chatTitle">Ticket</h3>
                <span id="chatMeta"></span>
              </div>
              <div id="staffActions"></div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="chat-input">
              <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
              <button class="btn btn-primary" onclick="sendMessage()">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- AUTH SCREEN -->
    <div class="auth-screen active" id="authScreen">
      <div class="auth-card">
        <h2>Welcome to Wyvern</h2>
        <p>Login with your Discord account to continue</p>
        <button class="discord-btn" onclick="startDiscordLogin()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          Continue with Discord
        </button>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal">
      <div class="modal">
        <h3 id="modalTitle">New Ticket</h3>
        <input type="text" id="modalInput" placeholder="Ticket title...">
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="modalConfirm" onclick="confirmModal()">Create</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DISCORD_AUTH_URL = "https://discord.com/oauth2/authorize?client_id=1535502240352313425&response_type=code&redirect_uri=https%3A%2F%2Fwyvern-auth.julianisok2.workers.dev%2Fcallback&scope=identify+guilds+rpc";

    let config = { owners: [], devs: [] };
    let currentUser = null;
    let tickets = [];
    let activeTicketId = null;
    let modalMode = "create";

    async function init() {
      await loadConfig();
      loadTickets();

      // Returning from Discord Auth Worker
      const params = new URLSearchParams(window.location.search);
      if (params.has("id") && params.has("username")) {
        const user = {
          id: params.get("id"),
          username: params.get("username"),
          avatar: params.get("avatar")
        };
        localStorage.setItem("wyvern_user", JSON.stringify(user));
        window.history.replaceState({}, document.title, window.location.pathname);
        currentUser = user;
        enterApp();
        return;
      }

      const saved = localStorage.getItem("wyvern_user");
      if (saved) {
        currentUser = JSON.parse(saved);
        enterApp();
      }
    }

    async function loadConfig() {
      try {
        const res = await fetch("config.txt");
        if (!res.ok) return;
        const text = await res.text();
        text.split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
          const parts = line.split(/\s+/);
          if (parts.length < 2) return;
          const role = parts[0].toLowerCase();
          const id = parts[1];
          const username = parts.slice(2).join(" ") || "Unknown";
          if (role === "owner") config.owners.push({ id, username });
          if (role === "dev") config.devs.push({ id, username });
        });
      } catch (e) {}
    }

    function loadTickets() {
      tickets = JSON.parse(localStorage.getItem("wyvern_tickets") || "[]");
    }

    function saveTickets() {
      localStorage.setItem("wyvern_tickets", JSON.stringify(tickets));
    }

    function startDiscordLogin() {
      window.location.href = DISCORD_AUTH_URL;
    }

    function logout() {
      localStorage.removeItem("wyvern_user");
      currentUser = null;
      document.getElementById("mainHeader").classList.add("hidden");
      document.getElementById("authScreen").classList.add("active");
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    }

    function enterApp() {
      document.getElementById("authScreen").classList.remove("active");
      document.getElementById("mainHeader").classList.remove("hidden");
      updateUserUI();
      showPage("home");
    }

    function updateUserUI() {
      document.getElementById("userAvatar").src = currentUser.avatar;
      document.getElementById("userName").textContent = currentUser.username;

      const badge = getBadge(currentUser.id);
      const el = document.getElementById("userBadge");
      el.textContent = badge.text;
      el.className = "badge " + badge.class;

      // Greeting
      document.getElementById("greeting").textContent = `Welcome back, ${currentUser.username}`;
    }

    function getBadge(id) {
      if (config.owners.some(o => o.id === id)) return { text: "Owner", class: "badge-owner" };
      if (config.devs.some(d => d.id === id)) return { text: "Dev", class: "badge-dev" };
      return { text: "Member", class: "badge-member" };
    }

    function isStaff() {
      const b = getBadge(currentUser.id).text;
      return b === "Owner" || b === "Dev";
    }

    function showPage(name) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById("page-" + name).classList.add("active");

      document.getElementById("navHome").classList.toggle("active", name === "home");
      document.getElementById("navTickets").classList.toggle("active", name === "tickets");

      if (name === "tickets") renderTicketList();
    }

    // ===== TICKETS =====
    function renderTicketList() {
      const list = document.getElementById("ticketList");
      const header = document.getElementById("listHeader");
      let visible = isStaff() ? tickets : tickets.filter(t => t.authorId === currentUser.id);
      header.textContent = isStaff() ? "All Tickets" : "Your Tickets";

      if (visible.length === 0) {
        list.innerHTML = `<div style="padding:30px;text-align:center;color:var(--muted);font-size:0.9rem;">No tickets yet</div>`;
        return;
      }

      list.innerHTML = visible
        .sort((a, b) => b.updated - a.updated)
        .map(t => `
          <div class="ticket-item ${t.id === activeTicketId ? "active" : ""}" onclick="openTicket('${t.id}')">
            <div class="title">${escapeHtml(t.title)}</div>
            <div class="meta">
              <span>${t.authorName}</span>
              <span class="status status-${t.status}">${t.status}</span>
            </div>
          </div>
        `).join("");
    }

    function openTicket(id) {
      activeTicketId = id;
      const ticket = tickets.find(t => t.id === id);
      if (!ticket) return;

      document.getElementById("chatEmpty").classList.add("hidden");
      document.getElementById("chatActive").classList.remove("hidden");
      document.getElementById("chatActive").style.display = "flex";

      document.getElementById("chatTitle").textContent = ticket.title;
      document.getElementById("chatMeta").textContent = `${ticket.authorName} · ${ticket.status}`;

      const actions = document.getElementById("staffActions");
      if (isStaff()) {
        actions.innerHTML = `
          <button class="btn btn-ghost" onclick="openRenameModal()">Rename</button>
          <button class="btn btn-danger" onclick="toggleTicketStatus()">${ticket.status === "open" ? "Close" : "Reopen"}</button>
        `;
      } else {
        actions.innerHTML = "";
      }

      renderMessages(ticket);
      renderTicketList();
    }

    function renderMessages(ticket) {
      const box = document.getElementById("messages");
      box.innerHTML = ticket.messages.map(m => `
        <div class="msg ${m.authorId === currentUser.id ? "me" : "other"}">
          ${m.authorId !== currentUser.id ? `<div class="author">${escapeHtml(m.authorName)}</div>` : ""}
          ${escapeHtml(m.text)}
        </div>
      `).join("");
      box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text || !activeTicketId) return;

      const ticket = tickets.find(t => t.id === activeTicketId);
      if (!ticket || ticket.status === "closed") {
        alert("This ticket is closed");
        return;
      }

      ticket.messages.push({
        authorId: currentUser.id,
        authorName: currentUser.username,
        text,
        time: Date.now()
      });
      ticket.updated = Date.now();
      saveTickets();
      input.value = "";
      renderMessages(ticket);
      renderTicketList();
    }

    function openCreateModal() {
      modalMode = "create";
      document.getElementById("modalTitle").textContent = "New Ticket";
      document.getElementById("modalInput").value = "";
      document.getElementById("modalConfirm").textContent = "Create";
      document.getElementById("modal").classList.add("active");
      document.getElementById("modalInput").focus();
    }

    function openRenameModal() {
      if (!activeTicketId) return;
      const ticket = tickets.find(t => t.id === activeTicketId);
      modalMode = "rename";
      document.getElementById("modalTitle").textContent = "Rename Ticket";
      document.getElementById("modalInput").value = ticket.title;
      document.getElementById("modalConfirm").textContent = "Save";
      document.getElementById("modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
    }

    function confirmModal() {
      const title = document.getElementById("modalInput").value.trim();
      if (!title) return;

      if (modalMode === "create") {
        const id = "t_" + Date.now();
        tickets.push({
          id,
          title,
          authorId: currentUser.id,
          authorName: currentUser.username,
          status: "open",
          created: Date.now(),
          updated: Date.now(),
          messages: [{
            authorId: currentUser.id,
            authorName: currentUser.username,
            text: "Ticket created",
            time: Date.now()
          }]
        });
        saveTickets();
        closeModal();
        openTicket(id);
      } else {
        const ticket = tickets.find(t => t.id === activeTicketId);
        ticket.title = title;
        ticket.updated = Date.now();
        saveTickets();
        closeModal();
        openTicket(activeTicketId);
      }
      renderTicketList();
    }

    function toggleTicketStatus() {
      const ticket = tickets.find(t => t.id === activeTicketId);
      if (!ticket) return;
      ticket.status = ticket.status === "open" ? "closed" : "open";
      ticket.updated = Date.now();
      saveTickets();
      openTicket(activeTicketId);
      renderTicketList();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    init();
  </script>
</body>
</html>
