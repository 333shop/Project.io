<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wyvern</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg1: #0f0c29;
      --bg2: #302b63;
      --bg3: #24243e;
      --accent: #a78bfa;
      --accent2: #8b5cf6;
      --text: #ffffff;
      --muted: #c4b5fd;
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.1);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Particles */
    .particle {
      position: fixed;
      width: 8px;
      height: 8px;
      background: rgba(167, 139, 250, 0.4);
      border-radius: 50%;
      pointer-events: none;
      animation: rise 12s linear infinite;
      z-index: 0;
    }
    @keyframes rise {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* ===== AUTH / LANDING ===== */
    .auth-screen {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }
    .auth-screen.active { display: flex; }

    .container {
      text-align: center;
      max-width: 720px;
      animation: fadeInUp 0.9s ease-out;
    }

    .icon-row {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .icon-box {
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: var(--accent);
      transition: all 0.3s ease;
      animation: float 3s ease-in-out infinite;
    }
    .icon-box:nth-child(2) { animation-delay: 0.4s; }
    .icon-box:nth-child(3) { animation-delay: 0.8s; }
    .icon-box:nth-child(4) { animation-delay: 1.2s; }
    .icon-box:hover {
      background: rgba(167,139,250,0.2);
      transform: translateY(-6px) scale(1.08);
      box-shadow: 0 10px 25px rgba(167,139,250,0.3);
    }

    .auth-screen h1 {
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #fff, #c4b5fd, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .highlight {
      color: #a78bfa;
      -webkit-text-fill-color: #a78bfa;
    }

    .auth-screen p {
      font-size: 1.15rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      opacity: 0.9;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 1rem 2.4rem;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(139,92,246,0.4);
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.5s;
    }
    .btn:hover::before { left: 100%; }
    .btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 12px 35px rgba(139,92,246,0.55);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ===== APP (after login) ===== */
    .app {
      display: none;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }
    .app.active { display: block; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: rgba(15,12,41,0.7);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
    }
    .logo span { color: var(--accent); }

    .nav {
      display: flex;
      gap: 6px;
    }
    .nav button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .nav button:hover,
    .nav button.active {
      color: white;
      background: rgba(167,139,250,0.15);
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 5px 14px 5px 5px;
    }
    .user-chip img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .user-meta .name { font-size: 0.9rem; font-weight: 600; }

    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 4px;
      width: fit-content;
      margin-top: 2px;
    }
    .badge-owner { background: #f59e0b; color: #1a1200; }
    .badge-dev { background: #3b82f6; color: white; }
    .badge-member { background: rgba(255,255,255,0.1); color: #c4b5fd; }

    .btn-sm {
      padding: 8px 16px;
      font-size: 0.85rem;
      border-radius: 8px;
    }
    .btn-danger {
      background: transparent;
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.3);
    }
    .btn-danger:hover { background: rgba(248,113,113,0.1); }

    /* Pages */
    .page {
      display: none;
      padding: 40px 24px;
      max-width: 1100px;
      margin: 0 auto;
      animation: fadeInUp 0.5s ease;
    }
    .page.active { display: block; }

    /* HOME */
    .home-hero {
      text-align: center;
      padding: 60px 0 40px;
    }
    .greeting {
      font-size: 1.15rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .home-hero h1 {
      font-size: clamp(3rem, 9vw, 5.5rem);
      font-weight: 800;
      background: linear-gradient(90deg, #fff, #c4b5fd, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }
    .discord-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 1.05rem;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 50px;
      border: 1px solid rgba(167,139,250,0.3);
      transition: 0.25s;
    }
    .discord-link:hover {
      background: rgba(167,139,250,0.12);
      transform: translateY(-2px);
    }

    .video-section {
      margin-top: 60px;
    }
    .video-section h3 {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }
    .video-card {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      aspect-ratio: 16/9;
    }
    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* TICKETS */
    .tickets-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .tickets-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tickets-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
      height: calc(100vh - 190px);
      min-height: 480px;
    }

    .ticket-list, .ticket-chat {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .ticket-list-header {
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .ticket-items {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .ticket-item {
      padding: 13px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.15s;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .ticket-item:hover { background: rgba(255,255,255,0.05); }
    .ticket-item.active {
      background: rgba(167,139,250,0.12);
      border-color: rgba(167,139,250,0.25);
    }
    .ticket-item .title {
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ticket-item .meta {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .status {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .status-open { background: rgba(34,197,94,0.15); color: #4ade80; }
    .status-closed { background: rgba(248,113,113,0.15); color: #f87171; }

    .chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-header h3 { font-size: 1.05rem; }
    .chat-header span { font-size: 0.78rem; color: var(--muted); }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.45;
      animation: fadeInUp 0.25s ease;
    }
    .msg.me {
      align-self: flex-end;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      border-bottom-right-radius: 4px;
    }
    .msg.other {
      align-self: flex-start;
      background: rgba(255,255,255,0.07);
      border-bottom-left-radius: 4px;
    }
    .msg .author {
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 3px;
      opacity: 0.85;
    }

    .chat-input {
      padding: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }
    .chat-input input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      font-size: 0.92rem;
      outline: none;
    }
    .chat-input input:focus { border-color: var(--accent); }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 12px;
      text-align: center;
      padding: 40px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(6px);
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: #1a1635;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
    }
    .modal h3 { margin-bottom: 16px; font-size: 1.2rem; }
    .modal input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: white;
      font-size: 0.95rem;
      margin-bottom: 16px;
      outline: none;
    }
    .modal input:focus { border-color: var(--accent); }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .hidden { display: none !important; }

    @media (max-width: 800px) {
      .tickets-layout { grid-template-columns: 1fr; height: auto; }
      .ticket-list { max-height: 260px; }
      header { padding: 12px 16px; }
      .nav { display: none; }
    }
  </style>
</head>
<body>

  <!-- Particles -->
  <div class="particle" style="left:10%;animation-delay:0s;"></div>
  <div class="particle" style="left:25%;animation-delay:2s;width:6px;height:6px;"></div>
  <div class="particle" style="left:40%;animation-delay:4s;"></div>
  <div class="particle" style="left:60%;animation-delay:1s;width:10px;height:10px;"></div>
  <div class="particle" style="left:75%;animation-delay:3s;"></div>
  <div class="particle" style="left:90%;animation-delay:5s;width:7px;height:7px;"></div>

  <!-- ===== LANDING / AUTH ===== -->
  <div class="auth-screen active" id="authScreen">
    <div class="container">
      <div class="icon-row">
        <div class="icon-box"><i class="fas fa-code"></i></div>
        <div class="icon-box"><i class="fas fa-shield-alt"></i></div>
        <div class="icon-box"><i class="fas fa-rocket"></i></div>
        <div class="icon-box"><i class="fas fa-magic"></i></div>
      </div>

      <h1>Welcome to <span class="highlight">Wyvern</span></h1>
      <p>Clean. Powerful. Built different.</p>

      <button class="btn" onclick="startDiscordLogin()">
        <i class="fab fa-discord"></i>
        Continue with Discord
      </button>
    </div>
  </div>

  <!-- ===== APP ===== -->
  <div class="app" id="app">
    <header>
      <div style="display:flex;align-items:center;gap:28px;">
        <a href="#" class="logo" onclick="showPage('home')">WYVERN<span>.</span></a>
        <nav class="nav">
          <button id="navHome" class="active" onclick="showPage('home')">
            <i class="fas fa-home"></i> Home
          </button>
          <button id="navTickets" onclick="showPage('tickets')">
            <i class="fas fa-ticket-alt"></i> Tickets
          </button>
        </nav>
      </div>

      <div class="user-area">
        <div class="user-chip">
          <img id="userAvatar" src="" alt="">
          <div class="user-meta">
            <span class="name" id="userName">User</span>
            <span class="badge" id="userBadge">Member</span>
          </div>
        </div>
        <button class="btn btn-sm btn-danger" onclick="logout()">Logout</button>
      </div>
    </header>

    <!-- HOME -->
    <div class="page" id="page-home">
      <div class="home-hero">
        <div class="greeting" id="greeting">Welcome back</div>
        <h1>WYVERN</h1>
        <a href="https://discord.gg/wyvernscripts" target="_blank" class="discord-link">
          <i class="fab fa-discord"></i> discord.gg/wyvernscripts
        </a>

        <div class="video-section">
          <h3>Preview</h3>
          <div class="video-grid">
            <div class="video-card">
              <video autoplay muted loop playsinline>
                <source src="video1.mp4" type="video/mp4">
              </video>
            </div>
            <div class="video-card">
              <video autoplay muted loop playsinline>
                <source src="video2.mp4" type="video/mp4">
              </video>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- TICKETS -->
    <div class="page" id="page-tickets">
      <div class="tickets-header">
        <h2><i class="fas fa-ticket-alt"></i> Tickets</h2>
        <button class="btn btn-sm" onclick="openCreateModal()">
          <i class="fas fa-plus"></i> New Ticket
        </button>
      </div>

      <div class="tickets-layout">
        <div class="ticket-list">
          <div class="ticket-list-header" id="listHeader">Your Tickets</div>
          <div class="ticket-items" id="ticketList"></div>
        </div>

        <div class="ticket-chat">
          <div class="empty-state" id="chatEmpty">
            <i class="fas fa-comments" style="font-size:2.5rem;opacity:0.4;"></i>
            <div>Select a ticket or create a new one</div>
          </div>

          <div id="chatActive" class="hidden" style="display:flex;flex-direction:column;height:100%;">
            <div class="chat-header">
              <div>
                <h3 id="chatTitle">Ticket</h3>
                <span id="chatMeta"></span>
              </div>
              <div id="staffActions"></div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="chat-input">
              <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
              <button class="btn btn-sm" onclick="sendMessage()">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modalTitle">New Ticket</h3>
      <input type="text" id="modalInput" placeholder="What do you need help with?">
      <div class="modal-actions">
        <button class="btn btn-sm" style="background:transparent;border:1px solid var(--border);" onclick="closeModal()">Cancel</button>
        <button class="btn btn-sm" id="modalConfirm" onclick="confirmModal()">Create</button>
      </div>
    </div>
  </div>

  <script>
    const DISCORD_AUTH_URL = "https://discord.com/oauth2/authorize?client_id=1535502240352313425&response_type=code&redirect_uri=https%3A%2F%2Fwyvern-auth.julianisok2.workers.dev%2Fcallback&scope=identify+guilds+rpc";

    let config = { owners: [], devs: [] };
    let currentUser = null;
    let tickets = [];
    let activeTicketId = null;
    let modalMode = "create";

    async function init() {
      await loadConfig();
      loadTickets();

      const params = new URLSearchParams(window.location.search);
      if (params.has("id") && params.has("username")) {
        const user = {
          id: params.get("id"),
          username: params.get("username"),
          avatar: params.get("avatar")
        };
        localStorage.setItem("wyvern_user", JSON.stringify(user));
        window.history.replaceState({}, document.title, window.location.pathname);
        currentUser = user;
        enterApp();
        return;
      }

      const saved = localStorage.getItem("wyvern_user");
      if (saved) {
        currentUser = JSON.parse(saved);
        enterApp();
      }
    }

    async function loadConfig() {
      try {
        const res = await fetch("config.txt");
        if (!res.ok) return;
        const text = await res.text();
        text.split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
          const parts = line.split(/\s+/);
          if (parts.length < 2) return;
          const role = parts[0].toLowerCase();
          const id = parts[1];
          if (role === "owner") config.owners.push({ id });
          if (role === "dev") config.devs.push({ id });
        });
      } catch(e) {}
    }

    function loadTickets() {
      tickets = JSON.parse(localStorage.getItem("wyvern_tickets") || "[]");
    }
    function saveTickets() {
      localStorage.setItem("wyvern_tickets", JSON.stringify(tickets));
    }

    function startDiscordLogin() {
      window.location.href = DISCORD_AUTH_URL;
    }

    function logout() {
      localStorage.removeItem("wyvern_user");
      currentUser = null;
      document.getElementById("app").classList.remove("active");
      document.getElementById("authScreen").classList.add("active");
    }

    function enterApp() {
      document.getElementById("authScreen").classList.remove("active");
      document.getElementById("app").classList.add("active");
      updateUserUI();
      showPage("home");
    }

    function updateUserUI() {
      document.getElementById("userAvatar").src = currentUser.avatar;
      document.getElementById("userName").textContent = currentUser.username;

      const badge = getBadge(currentUser.id);
      const el = document.getElementById("userBadge");
      el.textContent = badge.text;
      el.className = "badge " + badge.class;

      document.getElementById("greeting").textContent = `Welcome back, ${currentUser.username}`;
    }

    // Everyone is Member by default. Only IDs in config.txt get higher roles.
    function getBadge(id) {
      if (config.owners.some(o => o.id === id)) return { text: "Owner", class: "badge-owner" };
      if (config.devs.some(d => d.id === id)) return { text: "Dev", class: "badge-dev" };
      return { text: "Member", class: "badge-member" };
    }

    function isStaff() {
      const b = getBadge(currentUser.id).text;
      return b === "Owner" || b === "Dev";
    }

    function showPage(name) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById("page-" + name).classList.add("active");
      document.getElementById("navHome").classList.toggle("active", name === "home");
      document.getElementById("navTickets").classList.toggle("active", name === "tickets");
      if (name === "tickets") renderTicketList();
    }

    // ===== TICKETS =====
    function renderTicketList() {
      const list = document.getElementById("ticketList");
      const header = document.getElementById("listHeader");
      let visible = isStaff() ? tickets : tickets.filter(t => t.authorId === currentUser.id);
      header.textContent = isStaff() ? "All Tickets" : "Your Tickets";

      if (visible.length === 0) {
        list.innerHTML = `<div style="padding:30px;text-align:center;color:var(--muted);font-size:0.9rem;">No tickets yet</div>`;
        return;
      }

      list.innerHTML = visible
        .sort((a,b) => b.updated - a.updated)
        .map(t => `
          <div class="ticket-item ${t.id === activeTicketId ? "active" : ""}" onclick="openTicket('${t.id}')">
            <div class="title">${escapeHtml(t.title)}</div>
            <div class="meta">
              <span>${t.authorName}</span>
              <span class="status status-${t.status}">${t.status}</span>
            </div>
          </div>
        `).join("");
    }

    function openTicket(id) {
      activeTicketId = id;
      const ticket = tickets.find(t => t.id === id);
      if (!ticket) return;

      document.getElementById("chatEmpty").classList.add("hidden");
      document.getElementById("chatActive").classList.remove("hidden");
      document.getElementById("chatActive").style.display = "flex";

      document.getElementById("chatTitle").textContent = ticket.title;
      document.getElementById("chatMeta").textContent = `${ticket.authorName} · ${ticket.status}`;

      const actions = document.getElementById("staffActions");
      if (isStaff()) {
        actions.innerHTML = `
          <button class="btn btn-sm" style="background:transparent;border:1px solid var(--border);margin-right:6px;" onclick="openRenameModal()">Rename</button>
          <button class="btn btn-sm btn-danger" onclick="toggleTicketStatus()">${ticket.status === "open" ? "Close" : "Reopen"}</button>
        `;
      } else {
        actions.innerHTML = "";
      }

      renderMessages(ticket);
      renderTicketList();
    }

    function renderMessages(ticket) {
      const box = document.getElementById("messages");
      box.innerHTML = ticket.messages.map(m => `
        <div class="msg ${m.authorId === currentUser.id ? "me" : "other"}">
          ${m.authorId !== currentUser.id ? `<div class="author">${escapeHtml(m.authorName)}</div>` : ""}
          ${escapeHtml(m.text)}
        </div>
      `).join("");
      box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text || !activeTicketId) return;

      const ticket = tickets.find(t => t.id === activeTicketId);
      if (!ticket || ticket.status === "closed") {
        alert("This ticket is closed");
        return;
      }

      ticket.messages.push({
        authorId: currentUser.id,
        authorName: currentUser.username,
        text,
        time: Date.now()
      });
      ticket.updated = Date.now();
      saveTickets();
      input.value = "";
      renderMessages(ticket);
      renderTicketList();
    }

    function openCreateModal() {
      modalMode = "create";
      document.getElementById("modalTitle").textContent = "New Ticket";
      document.getElementById("modalInput").value = "";
      document.getElementById("modalConfirm").textContent = "Create";
      document.getElementById("modal").classList.add("active");
      document.getElementById("modalInput").focus();
    }

    function openRenameModal() {
      if (!activeTicketId) return;
      const ticket = tickets.find(t => t.id === activeTicketId);
      modalMode = "rename";
      document.getElementById("modalTitle").textContent = "Rename Ticket";
      document.getElementById("modalInput").value = ticket.title;
      document.getElementById("modalConfirm").textContent = "Save";
      document.getElementById("modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
    }

    function confirmModal() {
      const title = document.getElementById("modalInput").value.trim();
      if (!title) return;

      if (modalMode === "create") {
        const id = "t_" + Date.now();
        tickets.push({
          id,
          title,
          authorId: currentUser.id,
          authorName: currentUser.username,
          status: "open",
          created: Date.now(),
          updated: Date.now(),
          messages: [{
            authorId: currentUser.id,
            authorName: currentUser.username,
            text: "Ticket created",
            time: Date.now()
          }]
        });
        saveTickets();
        closeModal();
        openTicket(id);
      } else {
        const ticket = tickets.find(t => t.id === activeTicketId);
        ticket.title = title;
        ticket.updated = Date.now();
        saveTickets();
        closeModal();
        openTicket(activeTicketId);
      }
      renderTicketList();
    }

    function toggleTicketStatus() {
      const ticket = tickets.find(t => t.id === activeTicketId);
      if (!ticket) return;
      ticket.status = ticket.status === "open" ? "closed" : "open";
      ticket.updated = Date.now();
      saveTickets();
      openTicket(activeTicketId);
      renderTicketList();
    }

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    init();
  </script>
</body>
</html>
