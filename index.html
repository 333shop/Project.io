<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQ FILES</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      width: 100%;
      max-width: 1200px;
      padding: 40px 24px;
      gap: 60px;
      align-items: center;
    }

    /* LEFT SIDE */
    .left {
      flex: 1;
      max-width: 480px;
    }

    .badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #7c3aed;
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 52px;
      font-weight: 800;
      line-height: 1.1;
      color: #ffffff;
      margin-bottom: 16px;
      letter-spacing: -1px;
    }

    h1 span {
      color: #a78bfa;
    }

    .subtitle {
      font-size: 20px;
      color: #a1a1aa;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .get-started {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.35);
    }

    .get-started:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(124, 58, 237, 0.5);
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    }

    .get-started:active {
      transform: translateY(0);
    }

    /* RIGHT SIDE - Computer */
    .right {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .computer {
      width: 100%;
      max-width: 460px;
      background: #111118;
      border-radius: 16px;
      border: 1px solid #27272a;
      box-shadow: 
        0 0 0 1px rgba(255,255,255,0.03),
        0 25px 50px -12px rgba(0,0,0,0.6),
        0 0 80px rgba(124, 58, 237, 0.08);
      overflow: hidden;
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .titlebar-text {
      margin-left: 12px;
      font-size: 13px;
      color: #71717a;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .terminal {
      padding: 24px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.7;
      min-height: 320px;
      background: #0c0c10;
    }

    .line {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .line.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .prompt {
      color: #7c3aed;
      flex-shrink: 0;
    }

    .text {
      color: #d4d4d8;
    }

    .check {
      color: #22c55e;
      font-weight: bold;
    }

    .success {
      color: #22c55e;
      font-weight: 600;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #a78bfa;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .typing {
      color: #d4d4d8;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        gap: 48px;
        padding: 32px 20px;
      }

      .left {
        text-align: center;
        max-width: 100%;
      }

      h1 {
        font-size: 40px;
      }

      .subtitle {
        font-size: 18px;
      }

      .get-started {
        width: 100%;
        justify-content: center;
      }

      .computer {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LEFT -->
    <div class="left">
      <div class="badge">ROBLOX TOOL</div>
      <h1>&lt;SQ <span>FILES</span>&gt;</h1>
      <p class="subtitle">SQ Files is the best Roblox explorer.<br>Clean. Fast. Powerful.</p>
      <button class="get-started" onclick="alert('Coming soon!')">
        Get Started
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- RIGHT - Animated Computer -->
    <div class="right">
      <div class="computer">
        <div class="titlebar">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
          <div class="titlebar-text">sq-files — terminal</div>
        </div>
        <div class="terminal" id="terminal">
          <!-- Lines injected by JS -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const terminal = document.getElementById('terminal');

    const sequences = [
      [
        { type: 'prompt', text: 'Scanning workspace...' },
        { type: 'prompt', text: 'Reading place file...' },
        { type: 'check', text: '✓ Scripts detected' },
        { type: 'check', text: '✓ Models loaded' },
        { type: 'check', text: '✓ Services mapped' },
        { type: 'success', text: '→ Game folder found' }
      ],
      [
        { type: 'prompt', text: 'Indexing assets...' },
        { type: 'prompt', text: 'Parsing modules...' },
        { type: 'check', text: '✓ RemoteEvents found' },
        { type: 'check', text: '✓ DataStores ready' },
        { type: 'check', text: '✓ GUI elements scanned' },
        { type: 'success', text: '→ Game folder found' }
      ],
      [
        { type: 'prompt', text: 'Connecting to Studio...' },
        { type: 'prompt', text: 'Fetching hierarchy...' },
        { type: 'check', text: '✓ Workspace loaded' },
        { type: 'check', text: '✓ ReplicatedStorage OK' },
        { type: 'check', text: '✓ ServerScriptService OK' },
        { type: 'success', text: '→ Game folder found' }
      ]
    ];

    let seqIndex = 0;

    function clearTerminal() {
      terminal.innerHTML = '';
    }

    function addLine(content, className = '') {
      const line = document.createElement('div');
      line.className = 'line';
      line.innerHTML = content;
      terminal.appendChild(line);
      // Force reflow then show
      requestAnimationFrame(() => {
        line.classList.add('visible');
      });
      return line;
    }

    async function typeText(element, text, speed = 28) {
      const span = element.querySelector('.typing') || element;
      span.textContent = '';
      for (let i = 0; i < text.length; i++) {
        span.textContent += text[i];
        await new Promise(r => setTimeout(r, speed + Math.random() * 20));
      }
    }

    async function runSequence() {
      clearTerminal();
      const seq = sequences[seqIndex % sequences.length];
      seqIndex++;

      for (const item of seq) {
        if (item.type === 'prompt') {
          const line = addLine(`<span class="prompt">$</span> <span class="typing"></span><span class="cursor"></span>`);
          const typingSpan = line.querySelector('.typing');
          const cursor = line.querySelector('.cursor');
          await typeText(typingSpan, item.text);
          cursor.remove();
        } 
        else if (item.type === 'check') {
          await new Promise(r => setTimeout(r, 180));
          addLine(`<span class="check">${item.text}</span>`);
        } 
        else if (item.type === 'success') {
          await new Promise(r => setTimeout(r, 250));
          addLine(`<span class="success">${item.text}</span>`);
        }

        await new Promise(r => setTimeout(r, 320));
      }

      // Pause then loop
      await new Promise(r => setTimeout(r, 2200));
      runSequence();
    }

    // Start animation
    setTimeout(runSequence, 600);
  </script>
</body>
</html>
