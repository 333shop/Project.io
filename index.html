<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQ Checker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top left, #2a0a3a 0%, #0a0a0f 45%, #000000 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 60px;
      flex-wrap: wrap;
    }

    /* ===== LEFT SIDE ===== */
    .left {
      flex: 1;
      min-width: 280px;
      max-width: 460px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(140, 60, 220, 0.15);
      border: 1px solid rgba(160, 80, 255, 0.35);
      color: #c9a0ff;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 28px;
      letter-spacing: 0.3px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background: #a855f7;
      border-radius: 50%;
      box-shadow: 0 0 8px #a855f7;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    h1 {
      font-size: clamp(2.1rem, 5vw, 3.1rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #ffffff 30%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.15rem;
      color: #b8a0d0;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 380px;
    }

    .cta {
      display: inline-block;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
      transition: all 0.25s ease;
      border: none;
      cursor: pointer;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.55);
    }

    /* ===== RIGHT SIDE - PHONE + CARD ===== */
    .right {
      flex: 1;
      min-width: 300px;
      display: flex;
      justify-content: center;
      position: relative;
      height: 480px;
    }

    /* Floating Card */
    .card {
      position: absolute;
      top: 10px;
      right: 30px;
      width: 260px;
      height: 158px;
      background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 50%, #a855f7 100%);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(124, 58, 237, 0.45);
      z-index: 10;
      animation: floatCard 4s ease-in-out infinite;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.12) 50%, transparent 60%);
      animation: shine 5s infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0) rotate(3deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }

    @keyframes shine {
      0% { transform: translateX(-30%) translateY(-30%) rotate(0deg); }
      100% { transform: translateX(30%) translateY(30%) rotate(0deg); }
    }

    .card-chip {
      width: 36px;
      height: 28px;
      background: linear-gradient(135deg, #f0d78c, #d4af37);
      border-radius: 5px;
      margin-bottom: 28px;
    }

    .card-number {
      font-family: 'Courier New', monospace;
      font-size: 1.15rem;
      letter-spacing: 2.5px;
      margin-bottom: 18px;
      color: #fff;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .card-name {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.85;
    }

    .card-logo {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Phone */
    .phone {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-55%);
      width: 240px;
      height: 420px;
      background: #111;
      border-radius: 36px;
      border: 4px solid #2a2a2a;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), inset 0 0 0 2px #333;
      overflow: hidden;
      z-index: 5;
    }

    .phone-notch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 22px;
      background: #000;
      border-radius: 20px;
      z-index: 20;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #1a0a2e 0%, #0d0618 100%);
      padding: 50px 18px 20px;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-header h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e0d0ff;
    }

    .app-header p {
      font-size: 0.7rem;
      color: #8b7aa8;
      margin-top: 4px;
    }

    /* Typing area */
    .typing-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      min-height: 52px;
      display: flex;
      align-items: center;
    }

    .typed-text {
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      color: #d8b4fe;
      letter-spacing: 1.5px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 16px;
      background: #a855f7;
      margin-left: 2px;
      animation: blink 0.7s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Balance reveal */
    .balance-box {
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .balance-box.show {
      opacity: 1;
      transform: translateY(0);
    }

    .balance-label {
      font-size: 0.7rem;
      color: #a78bfa;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .balance-amount {
      font-size: 1.7rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .balance-status {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #4ade80;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
    }

    /* Responsive */
    @media (max-width: 800px) {
      .container {
        flex-direction: column;
        text-align: center;
      }
      .left {
        max-width: 100%;
      }
      .subtitle {
        margin-left: auto;
        margin-right: auto;
      }
      .right {
        height: 460px;
        margin-top: 20px;
      }
      .card {
        right: 50%;
        transform: translateX(40%) rotate(3deg);
      }
      .phone {
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LEFT -->
    <div class="left">
      <div class="badge">
        <span class="badge-dot"></span>
        Secure &amp; Encrypted
      </div>
      <h1>SQ Checker is the best CC checker</h1>
      <p class="subtitle">We are secure and safe.<br>Check your gift card now!</p>
      <button class="cta">Check Gift Card</button>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <!-- Floating Card -->
      <div class="card">
        <div class="card-chip"></div>
        <div class="card-number">•••• •••• •••• 4281</div>
        <div class="card-bottom">
          <div class="card-name">GIFT CARD</div>
          <div class="card-logo">VISA</div>
        </div>
      </div>

      <!-- Phone -->
      <div class="phone">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="app-header">
            <h3>SQ Checker</h3>
            <p>Gift Card Balance</p>
          </div>

          <div class="typing-box">
            <span class="typed-text" id="typed"></span><span class="cursor" id="cursor"></span>
          </div>

          <div class="balance-box" id="balance">
            <div class="balance-label">Available Balance</div>
            <div class="balance-amount">$247.50</div>
            <div class="balance-status">
              <span class="status-dot"></span>
              Valid Card
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const text = "4281 7593 0162 8840";
    const typedEl = document.getElementById("typed");
    const cursorEl = document.getElementById("cursor");
    const balanceEl = document.getElementById("balance");

    let i = 0;

    function type() {
      if (i < text.length) {
        typedEl.textContent += text.charAt(i);
        i++;
        setTimeout(type, 85 + Math.random() * 40);
      } else {
        // hide cursor after typing
        setTimeout(() => {
          cursorEl.style.display = "none";
          // show balance
          setTimeout(() => {
            balanceEl.classList.add("show");
          }, 400);
        }, 600);
      }
    }

    // start typing 
	  
    setTimeout(type, 1200);
  </script>
</body>
</html>
