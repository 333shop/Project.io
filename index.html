<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wyvern</title>
  <style>
    :root {
      --bg: #070b12;
      --card: #0f1520;
      --border: rgba(255,255,255,0.07);
      --accent: #5865F2;
      --accent-hover: #4752c4;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --owner: #f59e0b;
      --dev: #3b82f6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ===== BACKGROUND ===== */
    .app {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(88,101,242,0.12), transparent),
        radial-gradient(ellipse 60% 40% at 80% 60%, rgba(59,130,246,0.06), transparent),
        var(--bg);
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,11,18,0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span { color: var(--accent); }

    .nav {
      display: flex;
      gap: 4px;
    }

    .nav button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .nav button:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .nav button.active { color: var(--text); background: rgba(88,101,242,0.15); }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 4px 12px 4px 4px;
    }

    .user-chip img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .user-meta .name { font-size: 0.875rem; font-weight: 600; }
    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      width: fit-content;
      margin-top: 1px;
    }
    .badge-owner { background: var(--owner); color: #1a1200; }
    .badge-dev   { background: var(--dev); color: #fff; }
    .badge-member{ background: #334155; color: #cbd5e1; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,0.04); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(239,68,68,0.3);
    }
    .btn-danger:hover { background: rgba(239,68,68,0.1); }

    /* ===== PAGES ===== */
    .page { display: none; padding: 40px 32px; max-width: 1100px; margin: 0 auto; animation: fadeIn 0.35s ease; }
    .page.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* HOME */
    .home-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 160px);
      text-align: center;
    }

    .home-hero h1 {
      font-size: clamp(3.5rem, 10vw, 6rem);
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #fff 30%, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0;
    }

    /* TICKETS */
    .tickets-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .tickets-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tickets-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      height: calc(100vh - 200px);
      min-height: 480px;
    }

    .ticket-list {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .ticket-list-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ticket-items {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .ticket-item {
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .ticket-item:hover { background: rgba(255,255,255,0.03); }
    .ticket-item.active { background: rgba(88,101,242,0.12); border-color: rgba(88,101,242,0.25); }

    .ticket-item .title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ticket-item .meta {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .status {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .status-open   { background: rgba(34,197,94,0.15); color: #4ade80; }
    .status-closed { background: rgba(239,68,68,0.15); color: #f87171; }

    .ticket-chat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chat-header .info h3 {
      font-size: 1rem;
      font-weight: 600;
    }
    .chat-header .info span {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .chat-actions {
      display: flex;
      gap: 8px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.45;
      animation: msgIn 0.25s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.me {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.other {
      align-self: flex-start;
      background: rgba(255,255,255,0.06);
      border-bottom-left-radius: 4px;
    }

    .msg .author {
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 3px;
      opacity: 0.8;
    }

    .chat-input {
      padding: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }
    .chat-input input:focus { border-color: var(--accent); }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 12px;
      padding: 40px;
      text-align: center;
    }

    .empty-state svg { opacity: 0.4; }

    /* AUTH */
    .auth-screen {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-screen.active { display: flex; }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    .auth-card h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .auth-card p {
      color: var(--muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .discord-btn {
      width: 100%;
      background: #5865F2;
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
    }
    .discord-btn:hover {
      background: #4752c4;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(88,101,242,0.3);
    }

    .auth-footer {
      margin-top: 24px;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .auth-footer a {
      color: #a5b4fc;
      text-decoration: none;
    }
    .auth-footer a:hover { text-decoration: underline; }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.25s ease;
    }

    .modal h3 {
      font-size: 1.2rem;
      margin-bottom: 16px;
    }

    .modal input, .modal textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.9rem;
      margin-bottom: 14px;
      outline: none;
      resize: vertical;
    }
    .modal input:focus, .modal textarea:focus { border-color: var(--accent); }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* UTIL */
    .hidden { display: none !important; }
    @media (max-width: 800px) {
      .tickets-layout { grid-template-columns: 1fr; height: auto; }
      .ticket-list { max-height: 280px; }
      header { padding: 12px 16px; }
      .page { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">

    <!-- ========== HEADER (logged in) ========== -->
    <header id="mainHeader" class="hidden">
      <div class="left">
        <a href="#" class="logo" onclick="showPage('home')">WYVERN<span>.</span></a>
        <nav class="nav">
          <button id="navHome" class="active" onclick="showPage('home')">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home
          </button>
          <button id="navTickets" onclick="showPage('tickets')">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Tickets
          </button>
        </nav>
      </div>

      <div class="user-area">
        <div class="user-chip">
          <img id="userAvatar" src="" alt="">
          <div class="user-meta">
            <span class="name" id="userName">User</span>
            <span class="badge" id="userBadge">Member</span>
          </div>
        </div>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
      </div>
    </header>

    <!-- ========== HOME ========== -->
    <div class="page" id="page-home">
      <div class="home-hero">
        <h1>WYVERN</h1>
      </div>
    </div>

    <!-- ========== TICKETS ========== -->
    <div class="page" id="page-tickets">
      <div class="tickets-header">
        <h2>
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Tickets
        </h2>
        <button class="btn btn-primary" onclick="openCreateModal()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Ticket
        </button>
      </div>

      <div class="tickets-layout">
        <div class="ticket-list">
          <div class="ticket-list-header" id="listHeader">Your Tickets</div>
          <div class="ticket-items" id="ticketList"></div>
        </div>

        <div class="ticket-chat" id="ticketChat">
          <div class="empty-state" id="chatEmpty">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <div>Select a ticket or create a new one</div>
          </div>

          <div id="chatActive" class="hidden" style="display:flex;flex-direction:column;height:100%;">
            <div class="chat-header">
              <div class="info">
                <h3 id="chatTitle">Ticket</h3>
                <span id="chatMeta"></span>
              </div>
              <div class="chat-actions" id="staffActions"></div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="chat-input">
              <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
              <button class="btn btn-primary" onclick="sendMessage()">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== AUTH SCREENS ========== -->
    <div class="auth-screen active" id="authScreen">
      <div class="auth-card">
        <h2 id="authTitle">Welcome to Wyvern</h2>
        <p id="authDesc">Login or create an account with Discord</p>

        <button class="discord-btn" onclick="startDiscordLogin()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          Continue with Discord
        </button>

        <div class="auth-footer">
          By continuing you agree to the rules of the community.
        </div>
      </div>
    </div>

    <!-- CREATE / RENAME MODAL -->
    <div class="modal-overlay" id="modal">
      <div class="modal">
        <h3 id="modalTitle">New Ticket</h3>
        <input type="text" id="modalInput" placeholder="Ticket title...">
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="modalConfirm" onclick="confirmModal()">Create</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ================= CONFIG =================
    const DISCORD_AUTH_URL = "https://discord.com/oauth2/authorize?client_id=1535502240352313425&response_type=code&redirect_uri=https%3A%2F%2F333shop.github.io%2FProject.io%2F&scope=identify+guilds";

    let config = { owners: [], devs: [] };
    let currentUser = null;
    let tickets = [];
    let activeTicketId = null;
    let modalMode = 'create'; // create | rename

    // ================= INIT =================
    async function init() {
      await loadConfig();
      loadTickets();

      // Check if returning from Discord
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (code) {
        // Clean URL
        window.history.replaceState({}, document.title, window.location.pathname);
        // Demo login (real version needs backend to exchange code)
        handleDiscordReturn(code);
        return;
      }

      // Restore session
      const saved = localStorage.getItem('wyvern_user');
      if (saved) {
        currentUser = JSON.parse(saved);
        enterApp();
      }
    }

    async function loadConfig() {
      try {
        const res = await fetch('config.txt');
        if (!res.ok) return;
        const text = await res.text();
        text.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
          const parts = line.split(/\s+/);
          if (parts.length < 2) return;
          const role = parts[0].toLowerCase();
          const id = parts[1];
          const username = parts.slice(2).join(' ') || 'Unknown';
          if (role === 'owner') config.owners.push({ id, username });
          if (role === 'dev')   config.devs.push({ id, username });
        });
      } catch(e) {}
    }

    function loadTickets() {
      tickets = JSON.parse(localStorage.getItem('wyvern_tickets') || '[]');
    }

    function saveTickets() {
      localStorage.setItem('wyvern_tickets', JSON.stringify(tickets));
    }

    // ================= AUTH =================
    function startDiscordLogin() {
      window.location.href = DISCORD_AUTH_URL;
    }

    function handleDiscordReturn(code) {
      // DEMO: In production you send `code` to your backend,
      // backend exchanges it for access_token, then fetches user.
      // For now we create a realistic placeholder user.
      const demoUser = {
        id: '1535502240352313425',          // change to real Discord ID to test badges
        username: 'WyvernUser',
        avatar: 'https://cdn.discordapp.com/embed/avatars/1.png',
        discriminator: '0'
      };

      localStorage.setItem('wyvern_user', JSON.stringify(demoUser));
      currentUser = demoUser;
      enterApp();
    }

    function logout() {
      localStorage.removeItem('wyvern_user');
      currentUser = null;
      document.getElementById('mainHeader').classList.add('hidden');
      document.getElementById('authScreen').classList.add('active');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    }

    function enterApp() {
      document.getElementById('authScreen').classList.remove('active');
      document.getElementById('mainHeader').classList.remove('hidden');
      updateUserUI();
      showPage('home');
    }

    function updateUserUI() {
      document.getElementById('userAvatar').src = currentUser.avatar;
      document.getElementById('userName').textContent = currentUser.username;

      const badge = getBadge(currentUser.id);
      const el = document.getElementById('userBadge');
      el.textContent = badge.text;
      el.className = 'badge ' + badge.class;
    }

    function getBadge(id) {
      if (config.owners.some(o => o.id === id)) return { text: 'Owner', class: 'badge-owner' };
      if (config.devs.some(d => d.id === id))   return { text: 'Dev', class: 'badge-dev' };
      return { text: 'Member', class: 'badge-member' };
    }

    function isStaff() {
      return getBadge(currentUser.id).text === 'Owner' || getBadge(currentUser.id).text === 'Dev';
    }

    // ================= PAGES =================
    function showPage(name) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + name).classList.add('active');

      document.getElementById('navHome').classList.toggle('active', name === 'home');
      document.getElementById('navTickets').classList.toggle('active', name === 'tickets');

      if (name === 'tickets') renderTicketList();
    }

    // ================= TICKETS =================
    function renderTicketList() {
      const list = document.getElementById('ticketList');
      const header = document.getElementById('listHeader');

      let visible = isStaff()
        ? tickets
        : tickets.filter(t => t.authorId === currentUser.id);

      header.textContent = isStaff() ? 'All Tickets' : 'Your Tickets';

      if (visible.length === 0) {
        list.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted);font-size:0.9rem;">No tickets yet</div>`;
        return;
      }

      list.innerHTML = visible
        .sort((a,b) => b.updated - a.updated)
        .map(t => `
          <div class="ticket-item ${t.id === activeTicketId ? 'active' : ''}" onclick="openTicket('${t.id}')">
            <div class="title">${escapeHtml(t.title)}</div>
            <div class="meta">
              <span>${t.authorName}</span>
              <span class="status status-${t.status}">${t.status}</span>
            </div>
          </div>
        `).join('');
    }

    function openTicket(id) {
      activeTicketId = id;
      const ticket = tickets.find(t => t.id === id);
      if (!ticket) return;

      document.getElementById('chatEmpty').classList.add('hidden');
      document.getElementById('chatActive').classList.remove('hidden');
      document.getElementById('chatActive').style.display = 'flex';

      document.getElementById('chatTitle').textContent = ticket.title;
      document.getElementById('chatMeta').textContent = `${ticket.authorName} · ${ticket.status}`;

      // Staff actions
      const actions = document.getElementById('staffActions');
      if (isStaff()) {
        actions.innerHTML = `
          <button class="btn btn-ghost" onclick="openRenameModal()">Rename</button>
          <button class="btn btn-danger" onclick="toggleTicketStatus()">${ticket.status === 'open' ? 'Close' : 'Reopen'}</button>
        `;
      } else {
        actions.innerHTML = '';
      }

      renderMessages(ticket);
      renderTicketList();
    }

    function renderMessages(ticket) {
      const box = document.getElementById('messages');
      box.innerHTML = ticket.messages.map(m => `
        <div class="msg ${m.authorId === currentUser.id ? 'me' : 'other'}">
          ${m.authorId !== currentUser.id ? `<div class="author">${escapeHtml(m.authorName)}</div>` : ''}
          ${escapeHtml(m.text)}
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !activeTicketId) return;

      const ticket = tickets.find(t => t.id === activeTicketId);
      if (!ticket || ticket.status === 'closed') {
        alert('This ticket is closed');
        return;
      }

      ticket.messages.push({
        authorId: currentUser.id,
        authorName: currentUser.username,
        text,
        time: Date.now()
      });
      ticket.updated = Date.now();
      saveTickets();
      input.value = '';
      renderMessages(ticket);
      renderTicketList();
    }

    function openCreateModal() {
      modalMode = 'create';
      document.getElementById('modalTitle').textContent = 'New Ticket';
      document.getElementById('modalInput').value = '';
      document.getElementById('modalConfirm').textContent = 'Create';
      document.getElementById('modal').classList.add('active');
      document.getElementById('modalInput').focus();
    }

    function openRenameModal() {
      if (!activeTicketId) return;
      const ticket = tickets.find(t => t.id === activeTicketId);
      modalMode = 'rename';
      document.getElementById('modalTitle').textContent = 'Rename Ticket';
      document.getElementById('modalInput').value = ticket.title;
      document.getElementById('modalConfirm').textContent = 'Save';
      document.getElementById('modal').classList.add('active');
      document.getElementById('modalInput').focus();
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function confirmModal() {
      const title = document.getElementById('modalInput').value.trim();
      if (!title) return;

      if (modalMode === 'create') {
        const id = 't_' + Date.now();
        tickets.push({
          id,
          title,
          authorId: currentUser.id,
          authorName: currentUser.username,
          status: 'open',
          created: Date.now(),
          updated: Date.now(),
          messages: [{
            authorId: currentUser.id,
            authorName: currentUser.username,
            text: 'Ticket created',
            time: Date.now()
          }]
        });
        saveTickets();
        closeModal();
        openTicket(id);
      } else {
        const ticket = tickets.find(t => t.id === activeTicketId);
        ticket.title = title;
        ticket.updated = Date.now();
        saveTickets();
        closeModal();
        openTicket(activeTicketId);
      }
      renderTicketList();
    }

    function toggleTicketStatus() {
      const ticket = tickets.find(t => t.id === activeTicketId);
      if (!ticket) return;
      ticket.status = ticket.status === 'open' ? 'closed' : 'open';
      ticket.updated = Date.now();
      saveTickets();
      openTicket(activeTicketId);
      renderTicketList();
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Start
    init();
  </script>
</body>
</html>
